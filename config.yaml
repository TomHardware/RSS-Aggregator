app:
  name: "RSS Aggregator"
  language: "en"           # en / zh
  timezone: "Asia/Shanghai"   # 现在会真正应用到调度器
  # secret_key: "改成你自己的随机字符串"   # 不配置则每次启动随机生成（重启后登录状态失效）

database:
  # 相对路径锚定到项目根目录；容器内 WORKDIR=/app，因此实际落在 /app/data（已挂载的数据卷）
  url: "sqlite:///data/rss.db"
  # PostgreSQL 示例: postgresql://user:password@localhost/dbname

scheduler:
  enabled: true
  default_interval: 30     # 新增源的默认更新间隔（分钟，最小 5）

server:
  host: "0.0.0.0"
  port: 5000
  debug: false

auth:
  # 未配置任何口令时鉴权自动关闭（不会把现有部署锁在门外），但启动日志会给出警告。
  # 一旦配置口令，所有页面与接口都要求登录。
  enabled: true
  username: "admin"
  # password_hash: "pbkdf2:sha256:..."   # 生成：python -m app.auth <你的口令>
  # password: "明文口令"                  # 仅为方便试用，不推荐；启动时会提示改用哈希
  session_days: 14                        # 登录状态保持天数

retention:
  max_articles_per_source: 0   # 每个源最多保留多少条（0 = 不限）
  max_age_days: 0              # 只保留最近多少天（0 = 不限）

tasks:
  # 同时运行的后台抓取任务上限。达到上限时「添加源」会退回同步抓取，
  # 定时抓取会跳过本轮，避免无限起线程。
  max_concurrent: 5

fetch:
  retries: 3               # 网络类错误的重试次数
  timeout: 15              # 单次请求超时（秒）
  max_entries: 50          # 每次抓取最多「新增」多少条（按新增数封顶，历史条目会逐次补齐）
  max_bytes: 8388608       # 单个 feed 响应体上限（字节，默认 8 MB），超出即截断
  initial_async: true      # 添加源后立即返回，首次抓取放到后台线程（避免请求被拖住）
  user_agent: "RSSAggregator/2.0.9 (+https://github.com/forestwolf-ai/RSS-Aggregator)"

fulltext:
  enabled: true
  max_per_fetch: 5         # 每次抓取最多为几篇文章抓正文（0 = 关闭，避免请求被拖死）
  timeout: 10
  max_bytes: 2097152       # 单篇文章页响应体上限（字节，默认 2 MB）

security:
  # 是否允许抓取内网/回环地址。默认 false（防 SSRF）；只订阅内网源时再打开
  allow_private_networks: false
  # 校验跨站 POST 的 Origin/Referer（CSRF 的最低成本防线）
  csrf_origin_check: true
  # 走 HTTPS 时设为 true（会话 Cookie 只经加密连接传输）
  session_cookie_secure: false
  # 请求体上限（字节），防止超大表单占满内存
  max_content_bytes: 8388608

logging:
  level: "INFO"
  file: "rss_aggregator.log"

notifications:
  email:
    enabled: false
    smtp_server: "smtp.example.com"
    smtp_port: 587
    use_tls: true
    username: "user@example.com"
    password: "password"
    from_addr: "user@example.com"
    to_addr: "user@example.com"   # 多个收件人用英文逗号分隔
